"src/cine_analyzer/adapters/vision/pyscenedetect.py" = ["EM101", "PLC0415", "TRY003"]
# Lazy OpenCV/sklearn imports keep package import free of native libraries.
"src/cine_analyzer/adapters/vision/opencv_chromatics.py" = [
  "ANN401",
  "EM101",
  "PLC0415",
  "TRY003",
]
"src/cine_analyzer/adapters/vision/opencv_motion.py" = [
  "ANN401",
  "EM101",
  "PLC0415",
  "TRY003",
]
"src/cine_analyzer/adapters/vision/opencv_overlay.py" = [
