"scripts/**/*.py" = ["INP001", "PLR0913", "S404", "S603"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
# Strict mode with no relaxations. If a rule is ever disabled it is recorded
# here with the reason; an empty list is the current, deliberate state.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Native wheels ship no complete type stubs. Domain code never imports these
# modules; only adapters do, behind ports.
[[tool.mypy.overrides]]
module = [
  "av",
  "av.*",
  "cv2",
  "plotly",
  "plotly.*",
  "scenedetect",
  "scenedetect.*",
  "sklearn",
  "sklearn.*",
  "streamlit",
  "streamlit.*",
  "celery",
  "celery.*",
  "kombu",
  "kombu.*",
  "redis",
  "redis.*",
  "billiard",
  "billiard.*",
  "amqp",
  "vine",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--cov",
  "--cov-report=term-missing",
]
filterwarnings = [
  "error",
  # Starlette 1.6 TestClient still supports httpx but emits this warning until
  # httpx2 is the default client. Tests use FastAPI's TestClient, not httpx2.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:You should not use the 'timeout' argument with the TestClient:starlette.exceptions.StarletteDeprecationWarning",
  # Starlette 1.6 still types the portal factory against anyio.abc.BlockingPortal.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
xfail_strict = true
markers = [
  "live_critic: optional live OpenAI-compatible critic (not default CI)",
]

[tool.coverage.run]
source = ["cine_analyzer"]
branch = true
# __main__.py is exercised by test_cli.py::test_python_dash_m_entry_point_reports_the_same_version,
# which runs it in a subprocess that this coverage run does not follow.
omit = ["*/cine_analyzer/__main__.py"]

[tool.coverage.paths]
source = ["src/cine_analyzer", "*/site-packages/cine_analyzer"]

[tool.coverage.report]
show_missing = true
# The full suite (`make test` / `uv run pytest -q`) must stay at 100%.
# Phase guides also invoke pytest on a subdirectory; fail_under lives on the
# Makefile `test` target so those narrower commands are not punished for
# modules they were never asked to run.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
